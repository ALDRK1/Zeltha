<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Zeltha</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
  :root{
    --bg: #010b12;
    --bg-soft: #041620;
    --panel: #061c28;
    --text-main: #bdf4ff;
    --text-sub: #4d90a8;
    --error: #ff4d5e;
    --accent: #37e9ff;
    --accent-rgb: 55,233,255;
    --accent-dim: rgba(var(--accent-rgb),0.14);
    --accent-glow: rgba(var(--accent-rgb),0.65);
  }
  body.theme-pt{
    --bg: #120404;
    --bg-soft: #200707;
    --panel: #2a0a0a;
    --text-main: #ffd7d2;
    --text-sub: #a85a56;
    --error: #ff8a3d;
    --accent: #ff3b3b;
    --accent-rgb: 255,59,59;
    --accent-dim: rgba(255,59,59,0.14);
    --accent-glow: rgba(255,59,59,0.65);
  }
  body.theme-zh{
    --bg: #01120c;
    --bg-soft: #032018;
    --panel: #062c22;
    --text-main: #c9ffe9;
    --text-sub: #4da887;
    --error: #ff4d5e;
    --accent: #2be99a;
    --accent-rgb: 43,233,154;
    --accent-dim: rgba(43,233,154,0.14);
    --accent-glow: rgba(43,233,154,0.65);
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text-main);
    font-family: 'Orbitron', 'Share Tech Mono', 'Roboto Mono', 'SFMono-Regular', Consolas, monospace;
    -webkit-tap-highlight-color: transparent;
  }
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap');

  .app{
    position: relative;
    z-index: 1;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
  }

  /* ---------- Background FX: HUD rings + radial grid + scanning data, spawn/vanish ---------- */
  .bg-fx{
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 45%, rgba(var(--accent-rgb),0.07), transparent 60%),
      var(--bg);
  }
  .bg-fx::before{
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(var(--accent-rgb),0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(var(--accent-rgb),0.055) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: radial-gradient(ellipse at 50% 40%, black 0%, transparent 75%);
  }
  .bg-fx::after{
    content: '';
    position: absolute;
    left: 0; right: 0;
    height: 140px;
    top: -140px;
    background: linear-gradient(to bottom, transparent, rgba(var(--accent-rgb),0.09), transparent);
    animation: scanline 6.5s linear infinite;
  }
  @keyframes scanline{
    0%{ top: -140px; }
    100%{ top: 100%; }
  }
  .mandala-field, .num-field{
    position: absolute;
    inset: 0;
  }
  .mandala-piece{
    position: absolute;
    color: var(--accent);
  }
  .mandala-piece svg{
    display: block;
    width: 100%;
    height: 100%;
    stroke: var(--accent);
    fill: none;
    filter: drop-shadow(0 0 6px var(--accent-glow));
  }
  .mandala-piece.style-implode{ animation: mandala-implode var(--dur, 8s) ease-in-out forwards; }
  .mandala-piece.style-burst{ animation: mandala-burst var(--dur, 7s) ease-in-out forwards; }
  .mandala-piece.style-dissolve{ animation: mandala-dissolve var(--dur, 9s) ease-in-out forwards; }

  @keyframes mandala-implode{
    0%   { opacity: 0; transform: scale(0.3) rotate(0deg); }
    16%  { opacity: 0.5; transform: scale(1) rotate(70deg); }
    72%  { opacity: 0.45; transform: scale(1) rotate(220deg); }
    100% { opacity: 0; transform: scale(0.05) rotate(420deg); }
  }
  @keyframes mandala-burst{
    0%   { opacity: 0; transform: scale(0.3) rotate(0deg); filter: blur(0px); }
    16%  { opacity: 0.55; transform: scale(1) rotate(-50deg); filter: blur(0px); }
    70%  { opacity: 0.5; transform: scale(1.05) rotate(-170deg); filter: blur(0px); }
    100% { opacity: 0; transform: scale(1.9) rotate(-280deg); filter: blur(3px); }
  }
  @keyframes mandala-dissolve{
    0%   { opacity: 0; transform: scale(0.5) rotate(0deg); filter: blur(0px); }
    20%  { opacity: 0.45; transform: scale(1) rotate(35deg); filter: blur(0px); }
    75%  { opacity: 0.4; transform: scale(1) rotate(150deg); filter: blur(1px); }
    100% { opacity: 0; transform: scale(1) rotate(210deg); filter: blur(7px); }
  }

  .float-num{
    position: absolute;
    color: var(--accent);
    font-family: 'Share Tech Mono', monospace;
    line-height: 1;
    opacity: 0;
    text-shadow: 0 0 6px var(--accent-glow);
  }
  .float-num.style-flash{ animation: number-flash 2.6s ease-out forwards; }
  .float-num.style-explode{ animation: number-explode 1.5s ease-in forwards; }
  .float-num.style-dissolve{ animation: number-dissolve 3.2s ease-out forwards; }

  @keyframes number-flash{
    0%   { opacity: 0; transform: scale(0.6); filter: blur(0px); text-shadow: none; }
    18%  { opacity: 0.9; transform: scale(1); text-shadow: 0 0 6px rgba(var(--accent-rgb),0.9), 0 0 14px rgba(var(--accent-rgb),0.5); }
    70%  { opacity: 0.75; transform: scale(1); text-shadow: 0 0 4px rgba(var(--accent-rgb),0.5); }
    100% { opacity: 0; transform: scale(1.35); filter: blur(2px); text-shadow: 0 0 20px rgba(var(--accent-rgb),0.9); }
  }
  @keyframes number-explode{
    0%   { opacity: 0; transform: scale(0.5) rotate(0deg); letter-spacing: 0; text-shadow: none; }
    22%  { opacity: 1; transform: scale(1.1) rotate(0deg); text-shadow: 0 0 8px rgba(var(--accent-rgb),1); }
    55%  { opacity: 0.9; transform: scale(1.4) rotate(8deg); letter-spacing: 2px; }
    100% { opacity: 0; transform: scale(2.6) rotate(-6deg); letter-spacing: 10px; filter: blur(4px); text-shadow: 0 0 30px rgba(var(--accent-rgb),0.9); }
  }
  @keyframes number-dissolve{
    0%   { opacity: 0; transform: translateY(0) scale(0.8); filter: blur(0px); }
    20%  { opacity: 0.85; transform: translateY(0) scale(1); text-shadow: 0 0 5px rgba(var(--accent-rgb),0.7); }
    70%  { opacity: 0.55; transform: translateY(10px) scale(1); filter: blur(1px); }
    100% { opacity: 0; transform: translateY(28px) scale(1); filter: blur(5px); }
  }

  @media (prefers-reduced-motion: reduce){
    .mandala-piece{ animation: none !important; opacity: 0; }
    .float-num{ animation: none !important; opacity: 0; }
  }

  .brand{
    display:flex; align-items:center; gap:12px;
    color: var(--accent);
    font-family: 'Orbitron', monospace;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 4px;
    margin-bottom: 40px;
    user-select:none;
    text-shadow: 0 0 10px var(--accent-glow);
  }
  .brand .core{
    width: 22px; height: 22px;
    border: 2px solid var(--accent);
    border-radius: 50%;
    position: relative;
    box-shadow: 0 0 10px var(--accent-glow), inset 0 0 6px var(--accent-glow);
    animation: core-spin 4s linear infinite;
  }
  .brand .core::before, .brand .core::after{
    content:'';
    position:absolute;
    background: var(--accent);
  }
  .brand .core::before{ top: -4px; left: 50%; width:2px; height:6px; transform: translateX(-50%); box-shadow: 0 26px 0 var(--accent); }
  .brand .core::after{ left: -4px; top: 50%; height:2px; width:6px; transform: translateY(-50%); box-shadow: 26px 0 0 var(--accent); }
  @keyframes core-spin{ to{ transform: rotate(360deg); } }
  .brand b{ color: var(--text-main); font-weight:600; }
  .brand .sub{ font-size: 10px; color: var(--text-sub); letter-spacing: 2px; font-family: 'Share Tech Mono', monospace; margin-left: 4px; }

  /* ---------- Setup screen ---------- */
  #setup-screen{
    width: 100%;
    max-width: 700px;
    margin-top: 6vh;
  }
  #setup-screen h1{
    font-family: 'Orbitron', monospace;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--text-main);
    margin: 0 0 6px;
  }
  #setup-screen p.hint{
    color: var(--text-sub);
    font-size: 13px;
    font-family: 'Share Tech Mono', monospace;
    margin: 0 0 20px;
    line-height: 1.5;
  }
  textarea{
    width: 100%;
    min-height: 160px;
    background: var(--panel);
    border: 1px solid rgba(var(--accent-rgb),0.35);
    border-radius: 16px;
    color: var(--text-main);
    font-family: 'Share Tech Mono', monospace;
    font-size: 16px;
    padding: 16px;
    resize: vertical;
    outline: none;
    box-shadow: inset 0 0 18px rgba(var(--accent-rgb),0.06), 0 0 0 rgba(var(--accent-rgb),0);
    transition: box-shadow .2s ease, border-color .2s ease;
  }
  textarea:focus{ border-color: var(--accent); box-shadow: inset 0 0 18px rgba(var(--accent-rgb),0.1), 0 0 14px rgba(var(--accent-rgb),0.25); }
  .setup-actions{
    display:flex; gap:12px; margin-top:16px; flex-wrap: wrap;
  }
  button{
    font-family: 'Orbitron', monospace;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    border: none;
    border-radius: 16px;
    padding: 11px 24px;
    cursor: pointer;
    transition: transform .1s ease, filter .15s ease, box-shadow .2s ease;
  }
  button:active{ transform: scale(0.97); }
  .btn-primary{ background: var(--accent); color: #012028; box-shadow: 0 0 14px var(--accent-glow), 0 0 2px var(--accent-glow); }
  .btn-primary:hover{ filter: brightness(1.15); box-shadow: 0 0 22px var(--accent-glow); }
  .btn-ghost{ background: transparent; color: var(--text-sub); border: 1px solid rgba(var(--accent-rgb),0.35); }
  .btn-ghost:hover{ color: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px rgba(var(--accent-rgb),0.2); }
  .sample-menu-wrap{ position: relative; display: inline-block; }
  .sample-modal-overlay{
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(1,6,10,0.55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .sample-modal{
    width: 100%;
    max-width: 420px;
    max-height: 80vh;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid rgba(var(--accent-rgb),0.35);
    border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 24px rgba(var(--accent-rgb),0.2);
    padding: 20px;
  }
  .sample-modal-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .sample-modal-title{
    color: var(--accent);
    font-family: 'Orbitron', monospace;
    font-size: 14px;
    letter-spacing: 1px;
    text-shadow: 0 0 8px var(--accent-glow);
  }
  .sample-modal-close{
    background: transparent;
    border: 1px solid rgba(var(--accent-rgb),0.35);
    color: var(--text-sub);
    width: 28px; height: 28px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .sample-modal-close:hover{ color: var(--accent); border-color: var(--accent); }
  .sample-modal-grid{
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }
  .sample-topic-btn{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    width: auto;
    text-align: left;
    background: var(--bg-soft);
    border: 1px solid rgba(var(--accent-rgb),0.25);
    color: var(--text-main);
    font-family: inherit;
    font-size: 14px;
    padding: 11px 18px;
    border-radius: 999px;
    cursor: pointer;
    transition: border-color .15s, box-shadow .15s, background .15s, transform .15s;
  }
  .sample-topic-btn:nth-child(odd){ transform: rotate(-1.2deg); }
  .sample-topic-btn:nth-child(even){ transform: rotate(1.2deg); }
  .sample-topic-btn:hover, .sample-topic-btn:focus{
    border-color: var(--accent);
    background: var(--accent-dim);
    box-shadow: 0 0 12px rgba(var(--accent-rgb),0.25);
    outline: none;
    transform: scale(1.05) rotate(0deg);
  }
  .sample-topic-btn.sample-topic-all{
    color: var(--accent);
    border-color: rgba(var(--accent-rgb),0.5);
    font-weight: 600;
  }
  .sample-topic-icon{
    font-size: 16px;
    line-height: 1;
  }
  .btn-ghost.auto-active{
    color: #012028;
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 14px var(--accent-glow);
    animation: auto-pulse 1s ease-in-out infinite;
  }
  @keyframes auto-pulse{
    0%, 100%{ filter: brightness(1); }
    50%{ filter: brightness(1.25); }
  }
  #speakToggleBtn{ display:flex; align-items:center; gap:6px; }
  #speakToggleBtn svg{ display:block; flex-shrink:0; }
  .btn-ghost.speak-active{
    color: #012028;
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 14px var(--accent-glow);
  }
  #listenBtn{ display:flex; align-items:center; gap:6px; }
  #listenBtn svg{ display:block; flex-shrink:0; }
  .btn-ghost.listen-active{
    color: #012028;
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 14px var(--accent-glow);
    animation: auto-pulse 1s ease-in-out infinite;
  }
  .auto-speed-wrap{
    display:flex; align-items:center; gap:8px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text-sub);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .auto-speed-wrap input[type="range"]{
    -webkit-appearance: none;
    appearance: none;
    width: 90px;
    height: 3px;
    background: rgba(var(--accent-rgb),0.3);
    border-radius: 3px;
    outline: none;
    cursor: pointer;
  }
  .auto-speed-wrap input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance: none;
    appearance: none;
    width: 13px; height: 13px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent-glow);
    cursor: pointer;
  }
  .auto-speed-wrap input[type="range"]::-moz-range-thumb{
    width: 13px; height: 13px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent-glow);
    cursor: pointer;
  }
  .auto-speed-wrap #autoSpeedLabel{
    color: var(--accent);
    min-width: 34px;
    text-shadow: 0 0 6px var(--accent-glow);
  }
  @media (max-width: 600px){
    .auto-speed-wrap input[type="range"]{ width: 64px; }
  }

  .sample-row{ margin-top: 10px; font-size: 12px; color: var(--text-sub); }
  .sample-row a{ color: var(--text-sub); text-decoration: underline; cursor: pointer; }
  .sample-row a:hover{ color: var(--accent); }

  .lang-select{
    margin-bottom: 18px;
  }
  .lang-select .lang-label{
    display:block;
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-sub);
    margin-bottom: 8px;
  }
  .lang-options{
    display:flex; gap:10px; flex-wrap: wrap;
  }
  .lang-btn{
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    background: transparent;
    color: var(--text-sub);
    border: 1px solid rgba(var(--accent-rgb),0.3);
    border-radius: 16px;
    padding: 9px 18px;
    cursor: pointer;
    transition: all .2s ease;
    display:flex; align-items:center; gap:8px;
  }
  .lang-btn:hover{ color: var(--text-main); border-color: rgba(var(--accent-rgb),0.6); }
  .lang-btn.active{
    color: #012028;
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 14px var(--accent-glow);
  }
  .lang-btn .dot{
    width: 7px; height: 7px; border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 6px currentColor;
  }

  /* ---------- Typing screen ---------- */
  #type-screen{
    width: 100%;
    max-width: 900px;
  }
  .type-topbar{
    display:flex; justify-content: space-between; align-items:center;
    margin-bottom: 18px;
    color: var(--text-sub);
    font-family: 'Share Tech Mono', monospace;
    font-size: 15px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .type-topbar .stat span{ color: var(--accent); font-weight:600; text-shadow: 0 0 6px var(--accent-glow); }

  .stage{
    position: relative;
    background: var(--bg-soft);
    border-radius: 16px;
    border: 1px solid rgba(var(--accent-rgb),0.3);
    padding: 48px 28px 28px;
    box-shadow: inset 0 0 30px rgba(var(--accent-rgb),0.05), 0 0 24px rgba(var(--accent-rgb),0.06);
  }
  .stage::before, .stage::after,
  .stage .corner-tl, .stage .corner-tr, .stage .corner-bl, .stage .corner-br{
    content:'';
    position:absolute;
    width: 18px; height: 18px;
    border: 2px solid var(--accent);
    filter: drop-shadow(0 0 4px var(--accent-glow));
  }
  .stage::before{ top: 6px; left: 6px; border-right:none; border-bottom:none; border-radius: 8px 0 0 0; }
  .stage::after{ top: 6px; right: 6px; border-left:none; border-bottom:none; border-radius: 0 8px 0 0; }
  .stage .corner-bl{ bottom: 6px; left: 6px; border-right:none; border-top:none; border-radius: 0 0 0 8px; }
  .stage .corner-br{ bottom: 6px; right: 6px; border-left:none; border-top:none; border-radius: 0 0 8px 0; }

  .tooltip{
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%) translateY(4px);
    background: var(--accent);
    border: 1px solid #012028;
    color: #012028;
    padding: 6px 8px 6px 14px;
    border-radius: 16px;
    font-family: 'Orbitron', monospace;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s ease, transform .15s ease, left .12s ease;
    z-index: 5;
    box-shadow: 0 0 14px var(--accent-glow);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tooltip.show{ opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .tooltip .pinyin{
    font-family: 'Share Tech Mono', monospace;
    font-weight: 400;
    font-size: 12px;
    opacity: 0.75;
  }
  .tooltip::after{
    content:'';
    position:absolute; bottom:-5px; left:50%;
    width:8px; height:8px;
    background: var(--accent);
    transform: translateX(-50%) rotate(45deg);
  }
  .tooltip-save{
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    border-radius: 50%;
    color: #012028;
    padding: 0;
    letter-spacing: 0;
    text-transform: none;
    cursor: pointer;
    opacity: 0.65;
    pointer-events: auto;
    transition: opacity .15s ease, transform .1s ease;
  }
  .tooltip-save svg{ display:block; }
  .tooltip-save:hover{ opacity: 1; transform: scale(1.15); }
  .tooltip-save:active{ transform: scale(0.9); }
  .tooltip-save.saved-active{ opacity: 1; }
  .tooltip-save.saved-active svg{ fill: currentColor; }
  .tooltip-save.playing-active{ opacity: 1; animation: play-pulse 0.9s ease-in-out infinite; }
  .tooltip-save.saving-active{ opacity: 0.6; animation: play-pulse 0.6s ease-in-out infinite; pointer-events: none; }
  @keyframes play-pulse{
    0%, 100%{ transform: scale(1); }
    50%{ transform: scale(1.2); }
  }

  /* ---------- Traducción de selección (arrastrar el mouse sobre varias palabras) ---------- */
  .sel-translate-btn{
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%) translateY(4px) scale(0.9);
    background: var(--panel);
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 7px 14px;
    border-radius: 16px;
    font-family: 'Orbitron', monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    white-space: nowrap;
    display: none;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s ease, transform .15s ease;
    z-index: 6;
    box-shadow: 0 0 12px var(--accent-dim);
    user-select: none;
  }
  .sel-translate-btn.show{ display: flex; opacity: 1; transform: translateX(-50%) translateY(0) scale(1); pointer-events: auto; }
  .sel-translate-btn:hover{ background: var(--accent); color: #012028; }

  .sel-translate-bubble::after{

  /* En celulares el sistema pone su propia barra de "copiar/seleccionar todo"

  .sel-translate-btn.touch-mode{

    right: auto;
    bottom: auto;
    top: 90px;
    transform: translateX(-50%) translateY(-10px);
    max-width: min(90vw, 420px);
    z-index: 9999;

  .words{

  /* En táctil desactivamos la selección nativa del navegador: es la que dispara
     la barra propia del sistema ("Traducir / Copiar / Compartir") tapando
     nuestra burbuja de traducción y sin forma de cerrarla salvo tocando fuera
     (lo cual también cierra la traducción). En su lugar armamos la frase con
     un long-press + arrastre manual sobre los spans .word (ver JS, sección
     "selección táctil manual"), así nunca se crea una selección real del DOM

  .words.touch-nosel{

  /* ---------- Capa de posicionamiento aleatorio (fase de animación) ---------- */
  .review-anim-layer{ position:absolute; inset:0; }
  .review-pos{
    position:absolute;
    max-width: 84%;
    perspective: 600px;
  }
  .review-pos.rp-tl{ top:7%; left:5%; text-align:left; }
  .review-pos.rp-tc{ top:7%; left:50%; transform:translateX(-50%); text-align:center; }
  .review-pos.rp-tr{ top:7%; right:5%; text-align:right; }
  .review-pos.rp-ml{ top:50%; left:5%; transform:translateY(-50%); text-align:left; }
  .review-pos.rp-c { top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; }
  .review-pos.rp-mr{ top:50%; right:5%; transform:translateY(-50%); text-align:right; }
  .review-pos.rp-bl{ bottom:7%; left:5%; text-align:left; }
  .review-pos.rp-bc{ bottom:7%; left:50%; transform:translateX(-50%); text-align:center; }
  .review-pos.rp-br{ bottom:7%; right:5%; text-align:right; }

  .review-word, .review-translation{

  /* ---------- Animaciones de entrada ---------- */
  .anim-scale-in{ animation: rv-scale-in .6s cubic-bezier(.25,.8,.35,1) forwards; }
  @keyframes rv-scale-in{
    0%{ opacity:0; transform: scale(0.1); }
    100%{ opacity:1; transform: scale(1); }
  }
  .anim-pop-in{ animation: rv-pop-in .55s cubic-bezier(.34,1.56,.64,1) forwards; }
  @keyframes rv-pop-in{
    0%{ opacity:0; transform: scale(0.2); }
    70%{ opacity:1; transform: scale(1.18); }
    100%{ opacity:1; transform: scale(1); }
  }
  .anim-zoom-fade-in{ animation: rv-zoom-fade-in .6s ease-out forwards; }
  @keyframes rv-zoom-fade-in{
    0%{ opacity:0; transform: scale(2.2); filter: blur(4px); }
    100%{ opacity:1; transform: scale(1); filter: blur(0); }
  }
  .anim-elastic-in{ animation: rv-elastic-in .9s cubic-bezier(.68,-0.55,.27,1.55) forwards; }
  @keyframes rv-elastic-in{
    0%{ opacity:0; transform: scale(0.3) rotate(-8deg); }
    40%{ opacity:1; transform: scale(1.25) rotate(4deg); }
    65%{ transform: scale(0.9) rotate(-2deg); }
    85%{ transform: scale(1.06) rotate(1deg); }
    100%{ opacity:1; transform: scale(1) rotate(0deg); }
  }
  .anim-flip3d-in{ animation: rv-flip3d-in .7s ease-out forwards; }
  @keyframes rv-flip3d-in{
    0%{ opacity:0; transform: rotateY(90deg) scale(0.7); }
    100%{ opacity:1; transform: rotateY(0deg) scale(1); }
  }
  .anim-slam-in{ animation: rv-slam-in .55s cubic-bezier(.2,.9,.2,1) forwards; }
  @keyframes rv-slam-in{
    0%{ opacity:0; transform: translateY(-140px) scale(1.4); }
    70%{ opacity:1; transform: translateY(0) scale(1); }
    80%{ transform: translateX(-4px); }
    90%{ transform: translateX(3px); }
    100%{ transform: translateX(0); }
  }
  .anim-typewriter-pulse{ animation: rv-typewriter-pulse .35s ease-out forwards; }
  @keyframes rv-typewriter-pulse{
    0%{ transform: scale(1); }
    50%{ transform: scale(1.14); }
    100%{ transform: scale(1); }
  }

  /* ---------- Animaciones de salida ---------- */
  .anim-scale-out{ animation: rv-scale-out .45s ease-in forwards; }
  @keyframes rv-scale-out{
    0%{ opacity:1; transform: scale(1); }
    100%{ opacity:0; transform: scale(0.1); }
  }
  .anim-burst-out{ animation: rv-burst-out .55s ease-in forwards; }
  @keyframes rv-burst-out{
    0%{ opacity:1; transform: scale(1); filter: blur(0); }
    100%{ opacity:0; transform: scale(2.4); filter: blur(3px); }
  }
  .anim-particle-dissolve-out{ animation: rv-particle-dissolve-out .65s ease-out forwards; }
  @keyframes rv-particle-dissolve-out{
    0%{ opacity:1; transform: scale(1); filter: blur(0); letter-spacing: normal; }
    100%{ opacity:0; transform: scale(0.85); filter: blur(6px); letter-spacing: 6px; }
  }
  .anim-smoke-out{ animation: rv-smoke-out .65s ease-out forwards; }
  @keyframes rv-smoke-out{
    0%{ opacity:1; transform: translateY(0) scale(1); filter: blur(0); }
    100%{ opacity:0; transform: translateY(-38px) scale(1.25); filter: blur(7px); }
  }
  .anim-flip3d-out{ animation: rv-flip3d-out .55s ease-in forwards; }
  @keyframes rv-flip3d-out{
    0%{ opacity:1; transform: rotateY(0deg) scale(1); }
    100%{ opacity:0; transform: rotateY(-100deg) scale(0.6); }
  }
  .anim-glitch-pre{ animation: rv-glitch-pre .26s steps(2, end) forwards; }
  @keyframes rv-glitch-pre{
    0%{ transform: translate(0,0); }
    20%{ transform: translate(-4px, 2px); text-shadow: 3px 0 var(--error), -3px 0 var(--accent); }
    40%{ transform: translate(3px, -2px); text-shadow: -3px 0 var(--error), 3px 0 var(--accent); }
    60%{ transform: translate(-3px, 1px); text-shadow: 3px 0 var(--error), -3px 0 var(--accent); }
    80%{ transform: translate(2px, -1px); text-shadow: -3px 0 var(--error), 3px 0 var(--accent); }
    100%{ transform: translate(0,0); }
  }

  /* Letras individuales (split-in / typewriter-in / shatter-out / glitch-destroy-out) */
  .letter-fly-in{ opacity:0; animation: rv-letter-fly-in .6s cubic-bezier(.2,.8,.3,1.1) forwards; }
  @keyframes rv-letter-fly-in{
    0%{ opacity:0; transform: translate(var(--dx,0), var(--dy,0)) rotate(var(--rot,0deg)); }
    100%{ opacity:1; transform: translate(0,0) rotate(0deg); }
  }
  .letter-typewriter-in{ opacity:0; animation: rv-letter-typewriter-in .18s ease-out forwards; }
  @keyframes rv-letter-typewriter-in{ to{ opacity:1; } }
  .letter-fly-out{ animation: rv-letter-fly-out .55s ease-in forwards; }
  @keyframes rv-letter-fly-out{
    0%{ opacity:1; transform: translate(0,0) rotate(0deg); }
    100%{ opacity:0; transform: translate(var(--dx,0), var(--dy,0)) rotate(var(--rot,0deg)); }
  }

  @media (prefers-reduced-motion: reduce){
    .review-word, .review-translation, .review-letter{ animation: none !important; opacity: 1 !important; transform: none !important; filter: none !important; }
  }

  const SAMPLE_TOPICS = [
    { key: "ciencia", icon: "🔬", label: "Ciencia y tecnología", texts: [
      "La inteligencia artificial ha comenzado a transformar la manera en que trabajamos. Programas capaces de escribir, traducir y analizar datos ya forman parte de la rutina de muchas empresas. Sin embargo, los expertos advierten que estas herramientas todavía cometen errores y necesitan supervisión humana. El reto no es solo técnico, sino también ético.",
      "La edición genética permite corregir mutaciones responsables de enfermedades hereditarias. Técnicas como CRISPR han abierto posibilidades que parecían ciencia ficción hace apenas una década. Los científicos avanzan con cautela, conscientes de las implicaciones éticas de modificar el ADN humano. El debate apenas comienza.",
      "La computación cuántica promete resolver problemas que las computadoras actuales tardarían siglos en calcular. Aunque todavía está en fase experimental, gigantes tecnológicos invierten miles de millones en su desarrollo. Los primeros usos prácticos podrían aparecer en la química y la criptografía. Por ahora, sigue siendo un territorio más teórico que cotidiano.",

    { key: "naturaleza", icon: "🌿", label: "Naturaleza y animales", texts: [
      "Las abejas son responsables de la polinización de gran parte de los alimentos que consumimos. Sin ellas, frutas, verduras y frutos secos serían mucho más escasos. En las últimas décadas, su población ha disminuido por el uso de pesticidas y la pérdida de hábitat. Proteger a estos insectos es, en el fondo, proteger nuestra propia alimentación.",

      "Los lobos cumplen un papel clave en el equilibrio de los ecosistemas donde habitan. Al controlar las poblaciones de herbívoros, permiten que la vegetación se regenere de forma natural. Su reintroducción en algunos parques nacionales ha demostrado efectos positivos inesperados, incluso en el curso de los ríos. La naturaleza, cuando se le da espacio, encuentra su propio equilibrio.",
      "Los hongos forman una de las redes de comunicación más antiguas de la naturaleza. Bajo tierra, conectan raíces de árboles distintos y permiten el intercambio de nutrientes entre ellos. Algunos científicos llaman a esta red la 'internet del bosque'. Gracias a ella, un árbol enfermo puede recibir ayuda de sus vecinos sin que lo veamos.",

    ] },
    { key: "viajes", icon: "✈️", label: "Viajes y lugares", texts: [
      "Kioto conserva templos y jardines que parecen detenidos en el tiempo, incluso rodeados por una ciudad moderna. Caminar por sus calles empedradas en otoño, cuando las hojas cambian de color, es una experiencia que muchos viajeros describen como inolvidable. Los santuarios sintoístas conviven con cafeterías y tiendas de diseño contemporáneo. Esa mezcla de tradición y modernidad define el carácter único de la ciudad.",
      "La Patagonia, compartida entre Argentina y Chile, combina glaciares, montañas y estepas en un paisaje de extremos. Caminar cerca del glaciar Perito Moreno permite escuchar el estruendo del hielo al desprenderse. Las distancias son enormes y el clima cambia sin previo aviso. Quienes la visitan suelen describirla como un lugar que hace sentir pequeño frente a la naturaleza.",
      "Las islas Galápagos son un laboratorio natural donde conviven especies que no existen en ningún otro lugar del mundo. Las tortugas gigantes y las iguanas marinas parecen no temerle a la presencia humana. Charles Darwin encontró aquí las claves para su teoría de la evolución. Hoy, un estricto control turístico busca preservar este frágil equilibrio.",

      "El Transiberiano conecta Moscú con el extremo oriente de Rusia en un recorrido de más de nueve mil kilómetros. El viaje completo puede tomar una semana, atravesando bosques, estepas y ciudades que cambian de huso horario constantemente. Para muchos pasajeros, el tren se convierte en un espacio de convivencia entre desconocidos. El paisaje, monótono y vasto, invita a la introspección.",

      "La verdad no siempre es fácil de definir, incluso cuando creemos tenerla clara. Lo que consideramos cierto depende, en buena parte, de la información y la perspectiva que tenemos disponible. Reconocer los límites de nuestro propio conocimiento es, quizás, el primer paso hacia una comprensión más honesta del mundo. La duda, bien entendida, no es debilidad sino método.",

    { key: "arte", icon: "🎨", label: "Arte y cultura", texts: [
      "El grafiti, considerado durante décadas un acto de vandalismo, hoy ocupa un lugar reconocido dentro del arte contemporáneo. Artistas como Banksy han logrado que sus obras callejeras se vendan por millones de dólares en subastas. Esta transformación genera debate: ¿pierde su esencia el arte urbano al entrar al mercado formal? La calle y la galería, cada vez más, se entrelazan.",
      "El jazz nació a comienzos del siglo veinte como una mezcla de tradiciones africanas y europeas en Estados Unidos. Su característica principal, la improvisación, convirtió cada interpretación en una experiencia única e irrepetible. Músicos como Louis Armstrong y Miles Davis marcaron distintas etapas de su evolución. Hoy sigue influyendo géneros musicales muy alejados de su origen.",
      "El arte digital ha abierto nuevas posibilidades creativas, desde ilustraciones hechas con software hasta obras generadas por inteligencia artificial. Esta evolución genera preguntas sobre la autoría y el valor del proceso creativo humano. Algunos artistas ven la tecnología como una herramienta más; otros, como una amenaza a su oficio. El debate sobre qué es realmente arte sigue vigente.",
      "La fotografía cambió por completo la forma en que documentamos el mundo, permitiendo capturar un instante exacto que antes solo podía describirse con palabras o pintarse de memoria. Desde sus inicios en blanco y negro hasta las cámaras digitales actuales, ha democratizado la posibilidad de crear imágenes. Hoy, casi cualquier persona con un teléfono puede ser fotógrafo. Sin embargo, capturar una imagen verdaderamente significativa sigue requiriendo mirada y sensibilidad.",
    ] },

    { key: "negocios", icon: "💼", label: "Negocios", texts: [
      "Todo emprendimiento comienza con una idea, pero pocas veces sobrevive sin un plan que la respalde. Antes de lanzar un producto al mercado, es fundamental entender a quién va dirigido y qué problema resuelve realmente. Muchos negocios fracasan no por falta de calidad, sino por no encontrar suficientes clientes dispuestos a pagar por ellos. Validar la idea antes de invertir suele ahorrar tiempo y dinero.",
      "El flujo de caja es, para muchas pequeñas empresas, más importante incluso que las ganancias reportadas en el papel. Un negocio puede ser rentable y aun así quebrar por falta de liquidez inmediata. Por eso, llevar un control detallado de ingresos y gastos mensuales resulta indispensable desde el primer día. Los errores de gestión financiera suelen aparecer mucho antes de lo que se piensa.",
      "La reputación de una marca se construye durante años, pero puede dañarse en cuestión de horas gracias a las redes sociales. Un solo mal manejo de una queja pública puede afectar la percepción de miles de clientes potenciales. Por eso, muchas empresas invierten cada vez más en atención al cliente y gestión de crisis. Prevenir, en este terreno, suele ser mucho más barato que reparar.",
      "Las startups suelen operar bajo mucha incertidumbre, ajustando su modelo de negocio conforme reciben información del mercado real. A diferencia de las empresas tradicionales, priorizan la velocidad de aprendizaje sobre la perfección inicial. Fallar rápido y corregir el rumbo suele ser más valioso que tardar años en lanzar un producto perfecto. Esa mentalidad de adaptación constante define buena parte de su cultura.",
    ] },

es": ["la", "realidad", "virtual", "no", "se", "limita", "más", "a los", "videojuegos.", "ella", "es", "usada", "para", "entrenar", "cirujanos,", "simular", "ambientes", "peligrosos", "y", "tratar", "fobias", "en la", "terapia", "psicológica.", "los", "cascos/visores", "están", "cada", "vez", "más", "ligeros", "y", "accesibles", "al", "público", "en", "general.", "algunos", "analistas", "creen", "que", "esa", "tecnología", "redefinirá", "la", "manera", "como", "trabajamos", "y", "nos", "relacionamos."]}}, "Las abejas son responsables de la polinización de gran parte de los alimentos que consumimos. Sin ellas, frutas, verduras y frutos secos serían mucho más escasos. En las últimas décadas, su población ha disminuido por el uso de pesticidas y la pérdida de hábitat. Proteger a estos insectos es, en el fondo, proteger nuestra propia alimentación.": {"en": {"text": "Bees are responsible for pollinating much of the food we consume. Without them, fruits, vegetables and nuts would be much scarcer. In recent decades, their population has declined due to pesticide use and habitat loss. Protecting these insects is, deep down, protecting our own food supply.", "glosses": ["abejas", "son", "responsables", "de/por", "polinizar", "mucha", "de", "la", "comida", "nosotros", "consumimos.", "sin", "ellas,", "frutas,", "verduras", "y", "frutos secos", "serían", "ser", "mucho", "más escasos.", "en", "recientes", "décadas,", "su", "población", "ha", "disminuido", "debido", "a", "pesticidas", "uso", "y", "hábitat", "pérdida.", "proteger", "estos", "insectos", "es,", "en lo profundo", "abajo,", "proteger", "nuestra", "propia", "alimentos", "suministro."]}, "pt": {"text": "As abelhas são responsáveis pela polinização de grande parte dos alimentos que consumimos. Sem elas, frutas, legumes e frutos secos seriam muito mais escassos. Nas últimas décadas, sua população diminuiu devido ao uso de pesticidas e à perda de hábitat. Proteger esses insetos é, no fundo, proteger nossa própria alimentação.", "glosses": ["las", "abejas", "son", "responsables", "por la", "polinización", "de", "gran", "parte", "de los", "alimentos", "que", "consumimos.", "sin", "ellas,", "frutas,", "verduras/legumbres", "y", "frutos", "secos", "serían", "mucho", "más", "escasos.", "en las", "últimas", "décadas,", "su", "población", "disminuyó", "debido", "al", "uso", "de", "pesticidas", "y", "a la", "pérdida", "de", "hábitat.", "proteger", "esos", "insectos", "es,", "en el", "fondo,", "proteger", "nuestra", "propia", "alimentación."]}}, "Los bosques tropicales albergan más de la mitad de las especies del planeta en apenas una pequeña fracción de su superficie. Cada árbol talado representa la pérdida potencial de organismos que ni siquiera hemos llegado a conocer. La deforestación avanza principalmente por la expansión agrícola y ganadera. Restaurar estos ecosistemas toma décadas, mientras destruirlos apenas unos días.": {"en": {"text": "Tropical rainforests home more than half of the world's species in just a small fraction of its land area. Every tree cut down represents the potential loss of organisms we haven't even gotten to know. Deforestation advances mainly through agricultural and livestock expansion. Restoring these ecosystems takes decades, while destroying them takes just a few days.", "glosses": ["tropicales", "bosques", "albergan/hogar", "más", "de", "mitad", "de", "las", "del mundo", "especies", "en", "solo", "una", "pequeña", "fracción", "de", "su", "terrestre", "área.", "cada", "árbol", "cortado", "abajo", "representa", "la", "potencial", "pérdida", "de", "organismos", "nosotros", "no hemos", "siquiera", "llegado", "a", "conocer.", "deforestación", "avanza", "principalmente", "a través de", "agrícola", "y", "ganadera", "expansión.", "restaurar", "estos", "ecosistemas", "toma", "décadas,", "mientras que", "destruirlos", "a ellos", "toma", "apenas", "unos", "pocos", "días."]}, "pt": {"text": "As florestas tropicais abrigam mais da metade das espécies do planeta em apenas uma pequena fração de sua superfície. Cada árvore derrubada representa a perda potencial de organismos que nem sequer chegamos a conhecer. A desflorestação avança principalmente pela expansão agrícola e pecuária. Restaurar esses ecossistemas leva décadas, enquanto destruí-los leva apenas alguns dias.", "glosses": ["los", "bosques", "tropicales", "albergan", "más", "de la", "mitad", "de las", "especies", "del", "planeta", "en", "apenas", "una", "pequeña", "fracción", "de", "su", "superficie.", "cada", "árbol", "talado/derrumbado", "representa", "la", "pérdida", "potencial", "de", "organismos", "que", "ni", "siquiera", "llegamos", "a", "conocer.", "la", "deforestación", "avanza", "principalmente", "por la", "expansión", "agrícola", "y", "ganadera.", "restaurar", "esos", "ecosistemas", "toma/lleva", "décadas,", "mientras que", "destruirlos", "toma/lleva", "apenas", "algunos", "días."]}}, "Los lobos cumplen un papel clave en el equilibrio de los ecosistemas donde habitan. Al controlar las poblaciones de herbívoros, permiten que la vegetación se regenere de forma natural. Su reintroducción en algunos parques nacionales ha demostrado efectos positivos inesperados, incluso en el curso de los ríos. La naturaleza, cuando se le da espacio, encuentra su propio equilibrio.": {"en": {"text": "Wolves play a key role in the balance of the ecosystems where they live. By controlling herbivore populations, they allow vegetation to regenerate naturally. Their reintroduction in some national parks has shown unexpected positive effects, even on the course of rivers. Nature, when given space, finds its own balance.", "glosses": ["lobos", "juegan", "un", "clave", "papel", "en", "el", "equilibrio", "de", "los", "ecosistemas", "donde", "ellos", "viven.", "al", "controlar", "herbívoros", "poblaciones,", "ellos", "permiten", "vegetación", "a", "regenerarse", "naturalmente.", "su", "reintroducción", "en", "algunos", "nacionales", "parques", "ha", "demostrado", "inesperados", "positivos", "efectos,", "incluso", "en", "el", "curso", "de", "ríos.", "naturaleza,", "cuando", "dada", "espacio,", "encuentra", "su", "propio", "equilibrio."]}, "pt": {"text": "Os lobos desempenham um papel fundamental no equilíbrio dos ecossistemas onde habitam. Ao controlar as populações de herbívoros, permitem que a vegetação se regenere de forma natural. Sua reintrodução em alguns parques nacionais demonstrou efeitos positivos inesperados, inclusive no curso dos rios. A natureza, quando ganha espaço, encontra seu próprio equilíbrio.", "glosses": ["los", "lobos", "desempeñan", "un", "papel", "clave/fundamental", "en el", "equilibrio", "de los", "ecosistemas", "donde", "habitan.", "al", "controlar", "las", "poblaciones", "de", "herbívoros,", "permiten", "que", "la", "vegetación", "se", "regenere", "de", "forma", "natural.", "su", "reintroducción", "en", "algunos", "parques", "nacionales", "demostró", "efectos", "positivos", "inesperados,", "inclusive", "en el", "curso", "de los", "ríos.", "la", "naturaleza,", "cuando", "gana/recibe", "espacio,", "encuentra", "su", "propio", "equilibrio."]}}, "Los hongos forman una de las redes de comunicación más antiguas de la naturaleza. Bajo tierra, conectan raíces de árboles distintos y permiten el intercambio de nutrientes entre ellos. Algunos científicos llaman a esta red la 'internet del bosque'. Gracias a ella, un árbol enfermo puede recibir ayuda de sus vecinos sin que lo veamos.": {"en": {"text": "Fungi form one of the oldest communication networks in nature. Underground, they connect roots of different trees and allow the exchange of nutrients between them. Some scientists call this network the 'wood wide web'. Thanks to it, a sick tree can receive help from its neighbors without us seeing it.", "glosses": ["hongos", "forman", "una", "de", "las", "más antiguas", "comunicación", "redes", "en", "naturaleza.", "bajo tierra,", "ellos", "conectan", "raíces", "de", "diferentes", "árboles", "y", "permiten", "el", "intercambio", "de", "nutrientes", "entre", "ellos.", "algunos", "científicos", "llaman", "esta", "red", "la", "'del bosque", "amplia", "red'.", "gracias", "a", "ella,", "un", "enfermo", "árbol", "puede", "recibir", "ayuda", "de", "sus", "vecinos", "sin", "nosotros", "viendo", "ello."]}, "pt": {"text": "Os fungos formam uma das redes de comunicação mais antigas da natureza. Sob a terra, conectam raízes de árvores diferentes e permitem a troca de nutrientes entre elas. Alguns cientistas chamam essa rede de 'internet da floresta'. Graças a ela, uma árvore doente pode receber ajuda de suas vizinhas sem que a vejamos.", "glosses": ["los", "hongos", "forman", "una", "de las", "redes", "de", "comunicación", "más", "antiguas", "de la", "naturaleza.", "bajo", "la", "tierra,", "conectan", "raíces", "de", "árboles", "diferentes", "y", "permiten", "el", "intercambio", "de", "nutrientes", "entre", "ellas.", "algunos", "científicos", "llaman", "esa", "red", "de", "'internet", "de la", "bosque'.", "gracias", "a", "ella,", "un", "árbol", "enfermo", "puede", "recibir", "ayuda", "de", "sus", "vecinas", "sin", "que", "la", "veamos."]}}, "El águila arpía es una de las aves rapaces más poderosas del mundo, capaz de cazar presas casi tan pesadas como ella misma. Habita en lo profundo de la selva tropical, donde su presencia indica un ecosistema saludable. La pérdida de bosque continuo amenaza su supervivencia, ya que necesita grandes territorios para cazar. Verla en libertad es cada vez más difícil.": {"en": {"text": "The harpy eagle is one of the most powerful birds of prey in the world, capable of hunting prey almost as heavy as itself. It inhabits deep in the rainforest, where its presence indicates a healthy ecosystem. The loss of continuous forest threatens its survival, as it needs large territories to hunt. Seeing it in the wild is increasingly difficult.", "glosses": ["el", "arpía", "águila", "es", "una", "de", "las", "más", "poderosas", "aves", "de", "presa", "en", "el", "mundo,", "capaz", "de", "cazar", "presas", "casi", "tan", "pesadas", "como", "ella misma.", "esta", "habita", "profundo", "en", "la", "selva tropical,", "donde", "su", "presencia", "indica", "un", "saludable", "ecosistema.", "la", "pérdida", "de", "continuo", "bosque", "amenaza", "su", "supervivencia,", "ya que", "esta", "necesita", "grandes", "territorios", "para", "cazar.", "verla", "a ella", "en", "la", "libertad/naturaleza", "es", "cada vez más", "difícil."]}, "pt": {"text": "A harpia é uma das aves de rapina mais poderosas do mundo, capaz de caçar presas quase tão pesadas quanto ela mesma. Habita no fundo da floresta tropical, onde sua presença indica um ecossistema saudável. A perda de floresta contínua ameaça sua sobrevivência, pois precisa de grandes territórios para caçar. Vê-la em liberdade é cada vez mais difícil.", "glosses": ["el", "águila arpía", "es", "una", "de las", "aves", "de", "rapiña", "más", "poderosas", "del", "mundo,", "capaz", "de", "cazar", "presas", "casi", "tan", "pesadas", "como", "ella", "misma.", "habita", "en el", "fondo", "de la", "selva/bosque", "tropical,", "donde", "su", "presencia", "indica", "un", "ecosistema", "saludable.", "la", "pérdida", "de", "bosque/selva", "continua", "amenaza", "su", "supervivencia,", "pues/ya que", "necesita", "de", "grandes", "territorios", "para", "cazar.", "verla", "en", "libertad", "es", "cada", "vez", "más", "difícil."]}}, "Kioto conserva templos y jardines que parecen detenidos en el tiempo, incluso rodeados por una ciudad moderna. Caminar por sus calles empedradas en otoño, cuando las hojas cambian de color, es una experiencia que muchos viajeros describen como inolvidable. Los santuarios sintoístas conviven con cafeterías y tiendas de diseño contemporáneo. Esa mezcla de tradición y modernidad define el carácter único de la ciudad.": {"en": {"text": "Kyoto preserves temples and gardens that seem frozen in time, even surrounded by a modern city. Walking along its cobblestone streets in autumn, when the leaves change color, is an experience that many travelers describe as unforgettable. Shinto shrines coexist with coffee shops and contemporary design stores. That mix of tradition and modernity defines the city's unique character.", "glosses": ["Kioto", "conserva", "templos", "y", "jardines", "que", "parecen", "congelados/detenidos", "en", "tiempo,", "incluso", "rodeados", "por", "una", "moderna", "ciudad.", "caminar", "por/a lo largo de", "sus", "empedradas", "calles", "en", "otoño,", "cuando", "las", "hojas", "cambian", "de color,", "es", "una", "experiencia", "que", "muchos", "viajeros", "describen", "como", "inolvidable.", "sintoístas", "santuarios", "conviven", "con", "café", "tiendas", "y", "contemporáneo", "diseño", "tiendas.", "esa", "mezcla", "de", "tradición", "y", "modernidad", "define", "el", "de la ciudad", "único", "carácter."]}, "pt": {"text": "Quioto conserva templos e jardins que parecem parados no tempo, mesmo cercados por uma cidade moderna. Caminhar por suas ruas de paralelepípedos no outono, quando as folhas mudam de cor, é uma experiência que muitos viajantes descrevem como inesquecível. Os santuários xintoístas convivem com cafeterias e lojas de design contemporâneo. Essa mistura de tradição e modernidade define o caráter único da cidade.", "glosses": ["Kioto", "conserva", "templos", "y", "jardines", "que", "parecen", "detenidos/parados", "en el", "tiempo,", "incluso", "rodeados", "por", "una", "ciudad", "moderna.", "caminar", "por", "sus", "calles", "de", "empedradas/adoquines", "en el", "otoño,", "cuando", "las", "hojas", "cambian", "de", "color,", "es", "una", "experiencia", "que", "muchos", "viajeros", "describen", "como", "inolvidable.", "los", "santuarios", "sintoístas", "conviven", "con", "cafeterías", "y", "tiendas", "de", "diseño", "contemporáneo.", "esa", "mezcla", "de", "tradición", "y", "modernidad", "define", "el", "carácter", "único", "de la", "ciudad."]}}, "La Patagonia, compartida entre Argentina y Chile, combina glaciares, montañas y estepas en un paisaje de extremos. Caminar cerca del glaciar Perito Moreno permite escuchar el estruendo del hielo al desprenderse. Las distancias son enormes y el clima cambia sin previo aviso. Quienes la visitan suelen describirla como un lugar que hace sentir pequeño frente a la naturaleza.": {"en": {"text": "Patagonia, shared between Argentina and Chile, combines glaciers, mountains and steppes in a landscape of extremes. Walking near the Perito Moreno glacier lets you hear the roar of the ice as it breaks off. Distances are huge and the weather changes without warning. Those who visit it often describe it as a place that makes you feel small in front of nature.", "glosses": ["Patagonia,", "compartida", "entre", "Argentina", "y", "Chile,", "combina", "glaciares,", "montañas", "y", "estepas", "en", "un", "paisaje", "de", "extremos.", "caminar", "cerca de", "el", "Perito", "Moreno", "glaciar", "permite", "a ti", "escuchar", "el", "estruendo", "de", "el", "hielo", "cuando", "este", "se desprende", "fuera.", "distancias", "son", "enormes", "y", "el", "clima", "cambia", "sin", "aviso.", "aquellos", "que", "visitan", "ella", "a menudo", "describen", "esta", "como", "un", "lugar", "que", "hace", "a ti", "sentir", "pequeño", "en", "frente", "de", "naturaleza."]}, "pt": {"text": "A Patagônia, compartilhada entre Argentina e Chile, combina geleiras, montanhas e estepes em uma paisagem de extremos. Caminhar perto da geleira Perito Moreno permite ouvir o estrondo do gelo se desprendendo. As distâncias são enormes e o clima muda sem aviso prévio. Quem a visita costuma descrevê-la como um lugar que faz a gente se sentir pequeno diante da natureza.", "glosses": ["la", "Patagonia,", "compartida", "entre", "Argentina", "y", "Chile,", "combina", "glaciares,", "montañas", "y", "estepas", "en", "una", "paisaje", "de", "extremos.", "caminar", "cerca", "del", "glaciar", "Perito", "Moreno", "permite", "escuchar", "el", "estruendo", "del", "hielo", "se", "desprendiendo.", "las", "distancias", "son", "enormes", "y", "el", "clima", "cambia", "sin", "aviso", "previo.", "quien", "la", "visita", "suele", "describirla,", "como", "un", "lugar", "que", "hace", "la", "gente", "se", "sentir", "pequeño", "delante", "de la", "naturaleza."]}}, "Las islas Galápagos son un laboratorio natural donde conviven especies que no existen en ningún otro lugar del mundo. Las tortugas gigantes y las iguanas marinas parecen no temerle a la presencia humana. Charles Darwin encontró aquí las claves para su teoría de la evolución. Hoy, un estricto control turístico busca preservar este frágil equilibrio.": {"en": {"text": "The Galapagos Islands are a natural laboratory where species that do not exist anywhere else in the world live together. Giant tortoises and marine iguanas seem not to fear human presence. Charles Darwin found here the keys to his theory of evolution. Today, strict tourist control seeks to preserve this fragile balance.", "glosses": ["las", "Galápagos", "islas", "son", "un", "natural", "laboratorio", "donde", "especies", "que", "hacen", "no", "existir", "en ningún lugar", "más", "en", "el", "mundo", "conviven", "juntas.", "gigantes", "tortugas", "y", "marinas", "iguanas", "parecen", "no", "a", "temer", "humana", "presencia.", "Charles", "Darwin", "encontró", "aquí", "las", "claves", "para/a", "su", "teoría", "de", "evolución.", "hoy,", "estricto", "turístico", "control", "busca", "a", "preservar", "este", "frágil", "equilibrio."]}, "pt": {"text": "As Ilhas Galápagos são um laboratório natural onde convivem espécies que não existem em nenhum outro lugar do mundo. As tartarugas gigantes e as iguanas marinhas parecem não temer a presença humana. Charles Darwin encontrou aqui as chaves para sua teoria da evolução. Hoje, um rígido controle turístico busca preservar esse frágil equilíbrio.", "glosses": ["las", "islas", "Galápagos", "son", "un", "laboratorio", "natural", "donde", "conviven", "especies", "que", "no", "existen", "en", "ningún", "otro", "lugar", "del", "mundo.", "las", "tortugas", "gigantes", "y", "las", "iguanas", "marinas", "parecen", "no", "temer", "la", "presencia", "humana.", "Charles", "Darwin", "encontró", "aquí", "las", "claves", "para", "su", "teoría", "de la", "evolución.", "hoy,", "un", "estricto/rígido", "control", "turístico", "busca", "preservar", "ese", "frágil", "equilibrio."]}}, "Islandia combina volcanes, glaciares y aguas termales en un territorio relativamente pequeño. Sus paisajes cambian drásticamente en pocos kilómetros, desde campos de lava negra hasta cascadas heladas. La energía geotérmica calienta gran parte de sus hogares, aprovechando la actividad volcánica bajo la isla. Muchos viajeros la eligen para perseguir las auroras boreales durante el invierno.": {"en": {"text": "Iceland combines volcanoes, glaciers and hot springs in a relatively small territory. Its landscapes change drastically in a few kilometers, from black lava fields to frozen waterfalls. Geothermal energy heats much of its homes, taking advantage of volcanic activity under the island. Many travelers choose it to chase the northern lights during winter.", "glosses": ["Islandia", "combina", "volcanes,", "glaciares", "y", "aguas", "termales", "en", "un", "relativamente", "pequeño", "territorio.", "sus", "paisajes", "cambian", "drásticamente", "en", "unos", "pocos", "kilómetros,", "desde", "negra", "lava", "campos", "hasta", "congeladas", "cascadas.", "geotérmica", "energía", "calienta", "gran parte", "de", "sus", "hogares,", "tomando", "ventaja", "de", "volcánica", "actividad", "bajo", "la", "isla.", "muchos", "viajeros", "eligen", "esta", "para", "perseguir", "las", "del norte", "luces (auroras)", "durante", "invierno."]}, "pt": {"text": "A Islândia combina vulcões, geleiras e fontes termais em um território relativamente pequeno. Suas paisagens mudam drasticamente em poucos quilômetros, de campos de lava negra a cachoeiras congeladas. A energia geotérmica aquece grande parte de seus lares, aproveitando a atividade vulcânica sob a ilha. Muitos viajantes a escolhem para perseguir as auroras boreais durante o inverno.", "glosses": ["la", "Islandia", "combina", "volcanes,", "glaciares", "y", "fuentes", "termales", "en", "un", "territorio", "relativamente", "pequeño.", "sus", "paisajes", "cambian", "drásticamente", "en", "pocos", "kilómetros,", "de", "campos", "de", "lava", "negra", "a", "cascadas", "congeladas.", "la", "energía", "geotérmica", "calienta", "gran", "parte", "de", "sus", "hogares,", "aprovechando", "la", "actividad", "volcánica", "bajo", "la", "isla.", "muchos", "viajeros", "la", "eligen", "para", "perseguir", "las", "auroras", "boreales", "durante", "el", "invierno."]}}, "El Transiberiano conecta Moscú con el extremo oriente de Rusia en un recorrido de más de nueve mil kilómetros. El viaje completo puede tomar una semana, atravesando bosques, estepas y ciudades que cambian de huso horario constantemente. Para muchos pasajeros, el tren se convierte en un espacio de convivencia entre desconocidos. El paisaje, monótono y vasto, invita a la introspección.": {"en": {"text": "The Trans-Siberian Railway connects Moscow with Russia's Far East on a journey of more than nine thousand kilometers. The entire trip can take a week, crossing forests, steppes and cities that constantly change time zones. For many passengers, the train becomes a space of togetherness among strangers. The landscape, monotonous and vast, invites introspection.", "glosses": ["el", "Transiberiano", "ferrocarril", "conecta", "Moscú", "con", "de Rusia", "Lejano", "Este", "en", "un", "recorrido/viaje", "de", "más", "de", "nueve", "mil", "kilómetros.", "el", "completo/entero", "viaje", "puede", "tomar", "una", "semana,", "atravesando", "bosques,", "estepas", "y", "ciudades", "que", "constantemente", "cambian", "tiempo", "zonas.", "para", "muchos", "pasajeros,", "el", "tren", "se convierte en", "un", "espacio", "de", "convivencia/unión", "entre", "desconocidos.", "el", "paisaje,", "monótono", "y", "vasto,", "invita a", "introspección."]}, "pt": {"text": "O Transiberiano conecta Moscou ao extremo oriente da Rússia em um trajeto de mais de nove mil quilômetros. A viagem completa pode levar uma semana, atravessando florestas, estepes e cidades que mudam de fuso horário constantemente. Para muitos passageiros, o trem se torna um espaço de convivência entre desconhecidos. A paisagem, monótona e vasta, convida à introspecção.", "glosses": ["el", "Transiberiano", "conecta", "Moscú", "al", "extremo", "oriente", "de la", "Rusia", "en", "un", "trayecto", "de", "más", "de", "nueve", "mil", "kilómetros.", "el", "viaje", "completo", "puede", "tomar/llevar", "una", "semana,", "atravesando", "bosques/selvas,", "estepas", "y", "ciudades", "que", "cambian", "de", "huso", "horario", "constantemente.", "para", "muchos", "pasajeros,", "el", "tren", "se", "convierte", "un", "espacio", "de", "convivencia", "entre", "desconocidos.", "la", "paisaje,", "monótona", "y", "vasta,", "invita", "a la", "introspección."]}}, "La felicidad ha sido definida de formas muy distintas a lo largo de la historia. Para algunos filósofos antiguos, consistía en evitar el dolor y buscar la tranquilidad del espíritu. Para otros, era inseparable de la virtud y el cumplimiento del deber. Quizás no exista una única respuesta, sino tantas como personas intentan encontrarla.": {"en": {"text": "Happiness has been defined in very different ways throughout history. For some ancient philosophers, it consisted of avoiding pain and seeking peace of mind. For others, it was inseparable from virtue and the fulfillment of duty. Perhaps there is no single answer, but as many as people who try to find it.", "glosses": ["felicidad", "ha", "sido", "definida", "de", "muy", "diferentes", "maneras", "a lo largo de", "historia.", "para", "algunos", "antiguos", "filósofos,", "esta", "consistía", "en/de", "evitar", "dolor", "y", "buscar", "paz", "de", "espíritu/mente.", "para", "otros,", "esta", "era", "inseparable", "de", "virtud", "y", "el", "cumplimiento", "de", "deber.", "quizás", "allí", "hay", "no", "única", "respuesta,", "sino", "tan", "muchas", "como", "personas", "que", "intentan", "a", "encontrar", "la."]}, "pt": {"text": "A felicidade foi definida de formas muito diferentes ao longo da história. Para alguns filósofos antigos, consistia em evitar a dor e buscar a tranquilidade do espírito. Para outros, era inseparável da virtude e do cumprimento do dever. Talvez não exista uma resposta única, mas tantas quanto pessoas tentando encontrá-la.", "glosses": ["la", "felicidad", "fue", "definida", "de", "formas", "muy", "diferentes", "al", "largo", "de la", "historia.", "para", "algunos", "filósofos", "antiguos,", "consistía", "en", "evitar", "la", "dolor", "y", "buscar", "la", "tranquilidad", "del", "espíritu.", "para", "otros,", "era", "inseparable", "de la", "virtud", "y", "del", "cumplimiento", "del", "deber.", "tal vez", "no", "exista", "una", "respuesta", "única,", "sino", "tantas", "como/cuanto", "personas", "intentando", "encontrarla."]}}, "La libertad plantea una paradoja difícil de resolver: cuantas más opciones tenemos, más difícil se vuelve decidir. Algunos pensadores sostienen que el exceso de posibilidades genera ansiedad en lugar de plenitud. Otros defienden que solo eligiendo, incluso equivocándonos, construimos quiénes somos. La libertad, entonces, no siempre se siente como liberación.": {"en": {"text": "Freedom presents a paradox difficult to resolve: the more options we have, the harder it becomes to decide. Some thinkers argue that an excess of possibilities generates anxiety rather than fulfillment. Others defend that only by choosing, even by making mistakes, do we build who we are. Freedom, then, does not always feel like liberation.", "glosses": ["libertad", "presenta", "una", "paradoja", "difícil", "de", "resolver:", "mientras", "más", "opciones", "nosotros", "tenemos,", "más", "difícil", "ello", "se vuelve", "a", "decidir.", "algunos", "pensadores", "argumentan", "que", "un", "exceso", "de", "posibilidades", "genera", "ansiedad", "en lugar", "de", "plenitud.", "otros", "defienden", "que", "solo", "al", "elegir,", "incluso", "al", "cometer", "errores,", "hacemos", "nosotros", "construimos", "quiénes", "nosotros", "somos.", "libertad,", "entonces,", "hace", "no", "siempre", "siente", "como", "liberación."]}, "pt": {"text": "A liberdade apresenta um paradoxo difícil de resolver: quanto mais opções temos, mais difícil se torna decidir. Alguns pensadores sustentam que o excesso de possibilidades gera ansiedade em vez de plenitude. Outros defendem que só escolhendo, mesmo errando, construímos quem somos. A liberdade, portanto, nem sempre parece uma libertação.", "glosses": ["la", "libertad", "presenta", "un", "paradoja", "difícil", "de", "resolver:", "cuanto", "más", "opciones", "tenemos,", "más", "difícil", "se", "vuelve", "decidir.", "algunos", "pensadores", "sostienen", "que", "el", "exceso", "de", "posibilidades", "genera", "ansiedad", "en", "vez", "de", "plenitud.", "otros", "defienden", "que", "solo", "eligiendo,", "incluso", "equivocándonos,", "construimos", "quién", "somos.", "la", "libertad,", "por lo tanto,", "ni", "siempre", "parece/siente", "una", "liberación."]}}, "La verdad no siempre es fácil de definir, incluso cuando creemos tenerla clara. Lo que consideramos cierto depende, en buena parte, de la información y la perspectiva que tenemos disponible. Reconocer los límites de nuestro propio conocimiento es, quizás, el primer paso hacia una comprensión más honesta del mundo. La duda, bien entendida, no es debilidad sino método.": {"en": {"text": "Truth is not always easy to define, even when we believe we have it clear. What we consider true depends, to a large extent, on the information and perspective we have available. Recognizing the limits of our own knowledge is, perhaps, the first step toward a more honest understanding of the world. Doubt, well understood, is not weakness but method.", "glosses": ["verdad", "es", "no", "siempre", "fácil", "de", "definir,", "incluso", "cuando", "nosotros", "creemos", "nosotros", "tener", "la", "clara.", "lo que", "nosotros", "consideramos", "cierto/verdadero", "depende,", "en", "una", "gran", "medida,", "de", "la", "información", "y", "perspectiva", "nosotros", "tenemos", "disponible.", "reconocer", "los", "límites", "de", "nuestro", "propio", "conocimiento", "es,", "quizás,", "el", "primer", "paso", "hacia", "una", "más", "honesta", "comprensión", "de", "el", "mundo.", "duda,", "bien", "entendida,", "es", "no", "debilidad", "sino", "método."]}, "pt": {"text": "A verdade nem sempre é fácil de definir, mesmo quando acreditamos tê-la clara. O que consideramos certo depende, em grande parte, da informação e da perspectiva que temos disponível. Reconhecer os limites do nosso próprio conhecimento é, talvez, o primeiro passo para uma compreensão mais honesta do mundo. A dúvida, bem entendida, não é fraqueza, mas método.", "glosses": ["la", "verdad", "ni", "siempre", "es", "fácil", "de", "definir,", "incluso", "cuando", "creemos", "tenerla", "clara.", "lo", "que", "consideramos", "cierto", "depende,", "en", "gran", "parte,", "de la", "información", "y", "de la", "perspectiva", "que", "tenemos", "disponible.", "reconocer", "los", "límites", "del", "nuestro", "propio", "conocimiento", "es,", "tal vez,", "el", "primer", "paso", "para", "una", "comprensión", "más", "honesta", "del", "mundo.", "la", "duda,", "bien", "entendida,", "no", "es", "debilidad,", "sino", "método."]}}, "La curiosidad ha sido el motor de buena parte del avance humano, desde la ciencia hasta el arte. Preguntarse por qué las cosas son como son suele incomodar a quienes prefieren certezas. Sin embargo, es precisamente esa incomodidad la que empuja a explorar lo desconocido. Perder la curiosidad, más que envejecer, es dejar de crecer.": {"en": {"text": "Curiosity has been the engine of much of human progress, from science to art. Wondering why things are the way they are often bothers those who prefer certainties. However, it is precisely that discomfort that drives us to explore the unknown. Losing curiosity, more than getting old, is stopping growing.", "glosses": ["curiosidad", "ha", "sido", "el", "motor", "de", "gran parte", "de", "humano", "progreso,", "desde", "ciencia", "hasta", "arte.", "preguntarse", "por qué", "cosas", "son", "la", "manera/forma", "ellas", "son", "a menudo", "incomoda", "a aquellos", "que", "prefieren", "certezas.", "sin embargo,", "ello", "es", "precisamente", "esa", "incomodidad", "que", "empuja/impulsa", "a nosotros", "a", "explorar", "lo", "desconocido.", "perder", "curiosidad,", "más", "que", "envejecer", "viejo,", "es", "dejar de", "crecer."]}, "pt": {"text": "A curiosidade tem sido o motor de grande parte do avanço humano, da ciência à arte. Perguntar-se por que as coisas são como são costuma incomodar quem prefere certezas. No entanto, é precisamente esse desconforto que nos empurra a explorar o desconhecido. Perder a curiosidade, mais do que envelhecer, é deixar de crescer.", "glosses": ["la", "curiosidad", "ha", "sido", "el", "motor", "de", "gran", "parte", "del", "avance", "humano,", "de la", "ciencia", "al", "arte.", "preguntarse", "por", "qué", "las", "cosas", "son", "como", "son", "suele", "incomodar", "quien", "prefiere", "certezas.", "sin", "embargo,", "es", "precisamente", "ese", "incomodidad", "que", "nos", "empuja", "a", "explorar", "el", "desconocido.", "perder", "la", "curiosidad,", "más", "de", "que", "envejecer,", "es", "dejar", "de", "crecer."]}}, "Cada mañana, antes de salir de casa, reviso que no falte nada en mi mochila: las llaves, el teléfono, algo de dinero. Es un ritual pequeño, casi automático, pero que me da tranquilidad durante el resto del día. A veces me pregunto cuántas de nuestras rutinas hacemos sin siquiera notarlo. Quizás ahí está el secreto de sentirnos en control.": {"en": {"text": "Every morning, before leaving home, I check that nothing is missing from my backpack: the keys, the phone, some money. It is a small, almost automatic ritual, but one that gives me peace of mind for the rest of the day. Sometimes I wonder how many of our routines we do without even noticing. Perhaps that is where the secret to feeling in control lies.", "glosses": ["cada", "mañana,", "antes de", "salir de", "casa,", "yo", "reviso", "que", "nada", "está", "faltando", "de", "mi", "mochila:", "las", "llaves,", "el", "teléfono,", "algo de", "dinero.", "este", "es", "un", "pequeño,", "casi", "automático", "ritual,", "pero", "uno", "que", "da", "a mí", "paz", "de", "mente (tranquilidad)", "durante", "el", "resto", "de", "el", "día.", "a veces", "yo", "me pregunto", "cuántas", "cuántas", "de", "nuestras", "rutinas", "nosotros", "hacemos", "sin", "siquiera", "notarlo.", "quizás", "ahí", "está", "donde", "el", "secreto", "para", "sentirnos", "en", "control", "miente/yace."]}, "pt": {"text": "Toda manhã, antes de sair de casa, checo se não falta nada na minha mochila: as chaves, o telefone, algum dinheiro. É um pequeno ritual, quase automático, mas que me dá tranquilidade durante o resto do dia. Às vezes me pergunto quantas de nossas rotinas fazemos sem nem notar. Talvez aí esteja o segredo de nos sentirmos no controle.", "glosses": ["toda", "mañana,", "antes", "de", "salir", "de", "casa,", "reviso", "si", "no", "falta", "nada", "en la", "mi", "mochila:", "las", "llaves,", "el", "teléfono,", "algo de", "dinero.", "es", "un", "pequeño", "ritual,", "casi", "automático,", "pero", "que", "me", "da", "tranquilidad", "durante", "el", "resto", "del", "día.", "a las", "veces", "me", "pregunto", "cuántas", "de", "nuestras", "rutinas", "hacemos", "sin", "ni", "notar.", "tal vez", "ahí", "esté", "el", "secreto", "de", "nosotros", "sentirnos", "en el", "control."]}}, "Cocinar para otras personas tiene un valor que va más allá de alimentar. Preparar una comida pensando en los gustos de alguien más es, de alguna forma, un gesto de cariño silencioso. No siempre se necesita una ocasión especial para hacerlo. A veces, un plato sencillo compartido en casa vale más que una cena elaborada en un restaurante.": {"en": {"text": "Cooking for other people has a value that goes beyond feeding them. Preparing a meal thinking about someone else's tastes is, in a way, a silent gesture of affection. A special occasion is not always needed to do it. Sometimes, a simple dish shared at home is worth more than an elaborate dinner at a restaurant.", "glosses": ["cocinar", "para", "otras", "personas", "tiene", "un", "valor", "que", "va", "más allá de", "alimentar", "a ellos.", "preparar", "una", "comida", "pensando", "en", "alguien", "de otro", "gustos", "es,", "de", "una", "manera,", "un", "silencioso", "gesto", "de", "cariño.", "una", "especial", "ocasión", "es", "no", "siempre", "necesitada", "para", "hacer", "lo.", "a veces,", "un", "sencillo", "plato", "compartido", "en", "casa", "es", "vale", "más", "que", "una", "elaborada", "cena", "en", "un", "restaurante."]}, "pt": {"text": "Cozinhar para outras pessoas tem um valor que vai além de alimentar. Preparar uma refeição pensando nos gostos de outra pessoa é, de certa forma, um gesto de carinho silencioso. Nem sempre é precisa uma ocasião especial para fazê-lo. Às vezes, um prato simples compartilhado em casa vale mais do que um jantar elaborado em um restaurante.", "glosses": ["cocinar", "para", "otras", "personas", "tiene", "un", "valor", "que", "va", "más allá", "de", "alimentar.", "preparar", "una", "comida", "pensando", "en los", "gustos", "de", "otra", "persona", "es,", "de", "cierta", "forma,", "un", "gesto", "de", "cariño", "silencioso.", "ni", "siempre", "es", "necesaria", "una", "ocasión", "especial", "para", "hacerlo.", "a las", "veces,", "un", "plato", "sencillo", "compartido", "en", "casa", "vale", "más", "de", "que", "un", "cenar/jantar", "elaborado", "en", "un", "restaurante."]}}, "Las conversaciones por mensajes han reemplazado buena parte de las llamadas telefónicas de antes. Es más rápido escribir unas líneas que sostener una charla completa, pero también se pierde algo en el camino: el tono de voz, las pausas, la espontaneidad. Muchas personas valoran, cada vez más, encontrarse en persona o al menos escuchar la voz del otro. La tecnología facilita, pero no siempre reemplaza.": {"en": {"text": "Messaging conversations have replaced much of the phone calls of before. It is faster to write a few lines than to hold a full conversation, but something is also lost along the way: the tone of voice, the pauses, the spontaneity. Many people value, more and more, meeting in person or at least hearing each other's voice. Technology facilitates, but does not always replace.", "glosses": ["mensajería", "conversaciones", "han", "reemplazado", "gran parte", "de", "las", "telefónicas", "llamadas", "de", "antes.", "ello", "es", "más rápido", "a", "escribir", "unas", "pocas", "líneas", "que", "a", "sostener", "una", "completa", "conversación,", "pero", "algo", "es", "también", "perdido", "a lo largo de", "el", "camino:", "el", "tono", "de", "voz,", "las", "pausas,", "la", "espontaneidad.", "muchas", "personas", "valoran,", "más", "y", "más,", "encontrarse", "en", "persona", "o", "al", "menos", "escuchar", "de cada", "otro", "voz.", "tecnología", "facilita,", "pero", "hace", "no", "siempre", "reemplaza."]}, "pt": {"text": "As conversas por mensagens substituíram grande parte das chamadas telefônicas de antes. É mais rápido escrever algumas linhas do que manter uma conversa completa, mas também se perde algo pelo caminho: o tom de voz, as pausas, a espontaneidade. Muitas pessoas valorizam, cada vez mais, encontrar-se pessoalmente ou pelo menos ouvir a voz do outro. A tecnologia facilita, mas nem sempre substitui.", "glosses": ["las", "conversaciones", "por", "mensajes", "sustituyeron", "gran", "parte", "de las", "llamadas", "telefónicas", "de", "antes.", "es", "más", "rápido", "escribir", "algunas", "líneas", "de", "que", "mantener/sostener", "una", "conversación", "completa,", "pero", "también", "se", "pierde", "algo", "por el", "camino:", "el", "tono", "de", "voz,", "las", "pausas,", "la", "espontaneidad.", "muchas", "personas", "valoran,", "cada", "vez", "más,", "encontrarse", "personalmente", "o", "por el", "menos", "oír", "la", "voz", "del", "otro.", "la", "tecnología", "facilita,", "pero", "ni", "siempre", "sustituye."]}}, "Dormir bien parece sencillo, pero para muchas personas se ha convertido en un desafío constante. Las pantallas antes de dormir, el estrés acumulado o simplemente los horarios irregulares afectan la calidad del descanso. Pequeños cambios, como apagar las luces más temprano, suelen tener un efecto mayor del que se espera. El sueño, después de todo, no es un lujo sino una necesidad básica.": {"en": {"text": "Sleeping well seems simple, but for many people it has become a constant challenge. Screens before sleeping, accumulated stress or simply irregular schedules affect the quality of rest. Small changes, such as turning off the lights earlier, usually have a greater effect than expected. Sleep, after all, is not a luxury but a basic need.", "glosses": ["dormir", "bien", "parece", "sencillo,", "pero", "para", "muchas", "personas", "esto", "ha", "llegado a ser/convertido", "un", "constante", "desafío.", "pantallas", "antes de", "dormir,", "acumulado", "estrés", "o", "simplemente", "irregulares", "horarios", "afectan", "la", "calidad", "de", "descanso.", "pequeños", "cambios,", "tales", "como", "apagar", "fuera", "las", "luces", "más temprano,", "usualmente", "tienen", "un", "mayor", "efecto", "que", "esperado.", "sueño,", "después de", "todo,", "es", "no", "un", "lujo", "sino", "una", "básica", "necesidad."]}, "pt": {"text": "Dormir bem parece simples, mas para muitas pessoas tornou-se um desafio constante. As telas antes de dormir, o estresse acumulado ou simplesmente os horários irregulares afetam a qualidade do descanso. Pequenas mudanças, como apagar as luzes mais cedo, costumam ter um efeito maior do que o esperado. O sono, afi , "pt": {"text": "O grafite, considerado por décadas um ato de vandalismo, hoje ocupa um lugar reconhecido dentro da arte contemporânea. Artistas como Banksy conseguiram fazer com que suas obras de rua fossem vendidas por milhões de dólares em leilões. Essa transformação gera debate: a arte urbana perde sua essência ao entrar no mercado formal? A rua e a galeria, cada vez mais, se entrelaçam.", "glosses": ["el", "grafiti,", "considerado", "por", "décadas", "un", "acto", "de", "vandalismo,", "hoy", "ocupa", "un", "lugar", "reconocido", "dentro", "de la", "arte", "contemporánea.", "artistas", "como", "Banksy", "consiguieron", "hacer", "con", "que", "sus", "obras", "de", "calle/rua", "fuesen", "vendidas", "por", "millones", "de", "dólares", "en", "subastas.", "esa", "transformación", "genera", "debate:", "¿la", "arte", "urbana", "pierde", "su", "esencia", "al", "entrar", "en el", "mercado", "formal?", "la", "calle", "y", "la", "galería,", "cada", "vez", "más,", "se", "entrelaçam."]}}, "El jazz nació a comienzos del siglo veinte como una mezcla de tradiciones africanas y europeas en Estados Unidos. Su característica principal, la improvisación, convirtió cada interpretación en una experiencia única e irrepetible. Músicos como Louis Armstrong y Miles Davis marcaron distintas etapas de su evolución. Hoy sigue influyendo géneros musicales muy alejados de su origen.": {"en": {"text": "Jazz was born in the early twentieth century as a mix of African and European traditions in the United States. Its main characteristic, improvisation, turned each performance into a unique and unrepeatable experience. Musicians like Louis Armstrong and Miles Davis marked different stages of its evolution. Today it continues to influence musical genres far removed from its origin.", "glosses": ["jazz", "fue", "nacido", "en", "el", "comienzo/temprano", "veinte", "siglo", "como", "una", "mezcla", "de", "africanas", "y", "europeas", "tradiciones", "en", "los", "Unidos", "Estados.", "su", "principa y", "ese", "valor", "es", "descontado", "si", "decide", "reparar/arreglar", "aquí.", "cliente:", "entendido,", "mucho", "gracias", "por la", "información.", "vendedor:", "con", "gusto,", "cualquier", "duda", "que", "tenga", "puede", "volver."]}}, "Vendedor: Gracias por su compra, ¿le gustaría dejar su número para nuestro programa de puntos?\nCliente: Sí, claro, ¿cómo funciona?\nVendedor: Por cada compra acumula puntos que luego puede cambiar por descuentos.\nCliente: Suena bien, aquí tiene mi número.\nVendedor: Listo, ya quedó registrado. Que tenga un excelente día.\nCliente: Igualmente, muchas gracias por la atención.": {"en": {"text": "Salesperson: Thank you for your purchase, would you like to leave your number for our points program?\nCustomer: Yes, sure, how does it work?\nSalesperson: For each purchase you accumulate points that later you can change for discounts.\nCustomer: It sounds good, here you have my number.\nSalesperson: Done, already stayed registered. That you have an excellent day.\nCustomer: Likewise, many thanks for the attention.", "glosses": ["vendedor:", "gracias", "a ti", "por", "tu", "compra,", "quisieras", "tú", "gustaría", "a", "dejar", "tu", "número", "para", "nuestro", "de puntos", "programa?", "cliente:", "sí,", "claro,", "cómo", "hace", "este", "funcionar?", "vendedor:", "por", "cada", "compra", "tú", "acumulas", "puntos", "que", "luego", "tú", "puedes", "cambiar", "por", "descuentos.", "cliente:", "este", "suena", "bien,", "aquí", "tú", "tienes", "mi", "número.", "vendedor:", "listo,", "ya", "quedó", "registrado.", "que", "tú", "tengas", "un", "excelente", "día.", "cliente:", "igualmente,", "muchas", "gracias", "por", "la", "atención."]}, "pt": {"text": "Vendedor: Obrigado pela sua compra, gostaria de deixar seu número para o nosso programa de pontos?\nCliente: Sim, claro, como funciona?\nVendedor: A cada compra você acumula pontos que depois pode trocar por descontos.\nCliente: Parece bom, aqui está meu número.\nVendedor: Pronto, já f
